<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161816" />
    <meta name="description" content="An interactive Three.js and WebGL gallery of reflective metal cards." />
    <style>
      html,body,#root{width:100%;height:100%;margin:0;background:#161816}
      .garden-boot-shell{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;color:#80e200;font:500 15px/1 system-ui,sans-serif}
      .garden-boot-wave{display:flex;align-items:center;gap:5px;height:48px}
      .garden-boot-wave span{width:7px;height:32px;border-radius:99px;background:#80e200;box-shadow:0 0 12px rgba(128,226,0,.58);animation:garden-boot-pulse 1s ease-in-out infinite;transform-origin:center}
      .garden-boot-wave span:nth-child(2){animation-delay:.1s}.garden-boot-wave span:nth-child(3){animation-delay:.2s}.garden-boot-wave span:nth-child(4){animation-delay:.3s}.garden-boot-wave span:nth-child(5){animation-delay:.4s}.garden-boot-wave span:nth-child(6){animation-delay:.5s}.garden-boot-wave span:nth-child(7){animation-delay:.6s}
      .garden-boot-progress{width:3.75ch;text-align:right;font-variant-numeric:tabular-nums}
      @keyframes garden-boot-pulse{0%,100%{transform:translateY(0) scaleX(1) scaleY(.5);opacity:.46}50%{transform:translateY(-15%) scaleX(.8) scaleY(1.5);opacity:1}}
      @media(prefers-reduced-motion:reduce){.garden-boot-wave span{animation:none;opacity:.75}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=National+Park:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Three.js Metal Cards</title>
  </head>
  <body>
    <div id="root">
      <div class="garden-boot-shell" role="status" aria-label="Loading card collection">
        <div class="garden-boot-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="garden-boot-progress" aria-hidden="true">&nbsp;&nbsp;0%</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
